<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid {
        stroke: rgba(255, 255, 255, 0.04);
        stroke-width: 1;
      }
      .node-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .pod-flow {
        stroke-dasharray: 8, 12;
        animation: dash 20s linear infinite;
      }
      .wave-flow {
        animation: floatWave 8s ease-in-out infinite alternate;
      }
      .orbit-dot {
        animation: rotateOrbit 12s linear infinite;
        transform-origin: 1040px 180px;
      }
      .floating-pill {
        animation: floatPill 5s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -200;
        }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.85; transform: scale(1.02); }
      }
      @keyframes floatWave {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes rotateOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Isometric / Orthogonal Background Grid -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />

    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Dynamic Circuit / Network Flow Lines in Background (Lower opacity) -->
  <g opacity="0.4" class="wave-flow">
    <path d="M 50 310 C 250 310, 350 250, 550 270 C 750 290, 850 140, 1150 160" fill="none" stroke="url(#primaryGrad)" stroke-width="2" class="pod-flow" />
    <path d="M 50 80 C 300 80, 450 170, 750 150 C 950 130, 1050 260, 1180 260" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" class="pod-flow" />
  </g>

  <!-- Animated Kubernetes / Container Node Cluster Visual (Right side background) -->
  <g transform="translate(1040, 180)" opacity="0.6">
    <!-- Outer Orbit Ring -->
    <circle r="90" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,8" opacity="0.4" />
    <circle r="60" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5" />
    <circle r="30" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.3" />

    <!-- Center Hub -->
    <circle r="14" fill="#38bdf8" opacity="0.8" filter="url(#glow)">
      <animate attributeName="r" values="12;15;12" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="6" fill="#ffffff" />

    <!-- Orbiting Satellite Pods -->
    <g class="orbit-dot">
      <circle cx="60" cy="0" r="6" fill="#38bdf8" />
      <circle cx="-60" cy="0" r="5" fill="#818cf8" />
      <circle cx="0" cy="60" r="5" fill="#c084fc" />
      <circle cx="0" cy="-60" r="4" fill="#34d399" />
    </g>
  </g>

  <!-- Floating Tech Ecosystem Pills (Positioned safely away from title) -->
  <g class="floating-pill" transform="translate(730, 60)" opacity="0.85">
    <rect width="130" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="65" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">☸️ Kubernetes</text>
  </g>
  <g class="floating-pill" transform="translate(880, 85)" opacity="0.85" style="animation-delay: -2s;">
    <rect width="120" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
    <text x="60" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🐳 Docker / OCI</text>
  </g>
  <g class="floating-pill" transform="translate(770, 275)" opacity="0.85" style="animation-delay: -1.5s;">
    <rect width="150" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
    <text x="75" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌐 Multi-Cluster</text>
  </g>
  <g class="floating-pill" transform="translate(940, 250)" opacity="0.85" style="animation-delay: -3.5s;">
    <rect width="140" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
    <text x="70" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Control Planes</text>
  </g>

  <!-- Glowing Accent Line Divider -->
  <rect x="70" y="215" width="480" height="3" fill="url(#glowLineGrad)" />

  <!-- Foreground Clear Title & Subtitle (High contrast, never obscured) -->
  <g transform="translate(70, 0)">
    <!-- Category Tag / Badge -->
    <g transform="translate(0, 68)">
      <rect width="210" height="26" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="105" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">CLOUD-NATIVE &amp; DEVOPS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Container
    </text>
    <text x="0" y="195" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Management
    </text>

    <!-- Subtitle & Meta -->
    <text x="0" y="255" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Curated ecosystem of Multi-Cluster Control Planes, Kubernetes Distributions,
    </text>
    <text x="0" y="280" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">
      Enterprise SaaS Solutions, and High-Performance Open-Source Runtimes.
    </text>
  </g>
</svg>
